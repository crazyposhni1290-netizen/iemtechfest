# ---------------------------------------------------------------------------
# GitHub Pages deployment — publishes the site to
#   https://crazyposhni1290-netizen.github.io/iemtechfest/
# Runs automatically on every push to "main".
# No build step: the repo IS the site (static HTML/CSS/JS).
# ---------------------------------------------------------------------------
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # lets you run it manually from the Actions tab

# Tokens the deploy job needs (least privilege)
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; don't cancel an in-flight deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        # "enablement: true" turns Pages on automatically if it isn't already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
